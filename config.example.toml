# P2P configuration
[p2p]
# Shared secret channel ID — same on all your devices.
# Generated automatically on first run of: notify-relay serve
channel = "acid-bold-crew-dome-fork"

# Priority for notification routing. Lower number = higher priority.
# The present node (has dbus + unlocked) with the lowest priority number
# handles the notification. Desktop: 1, Laptop: 2, VPS last-resort: 50
priority = 1

# Multiaddrs to listen on (default: /ip4/0.0.0.0/tcp/0 = random port)
# listen = ["/ip4/0.0.0.0/tcp/0"]

# Enable mDNS for LAN discovery (default: true)
# mdns = true

# Bootstrap/relay peers for WAN connectivity (optional).
# If empty, the IPFS Amino DHT bootstrap nodes are used for peer discovery.
# Your VPS relay address is automatically used as a preferred circuit relay
# for NAT traversal (AutoRelay).
# bootstrap = ["/ip4/relay.example.com/tcp/4001/p2p/12D3KooW..."]

# Local gRPC server for "notify-relay" send command
[server]
unix = "/run/user/1000/notify-relay.sock"

# Notification delivery channels
[channels.dbus]
type = "dbus"

# Uncomment to add ntfy.sh forwarding (for VPS/phone notifications):
# [channels.phone]
# type = "ntfy"
# server = "https://ntfy.sh"
# topic = "my-notifications"

# Routes — order matters, first matching condition wins.
# Each node receives all notifications and decides locally whether to act.
#
# Available conditions:
#   always           - Always matches
#   screen_locked    - Local screen is locked
#   best_active      - This node is the best present node (has dbus,
#                      unlocked, lowest priority number)
#   no_better_peer   - No present node exists AND this is the highest
#                      priority number (last-resort forwarder)
#   remote_available - At least one remote peer is online
#   remote_present   - At least one remote peer is present

# Desktop/Laptop example (priority 1-2):
[[routes]]
condition = "best_active"
channel = "dbus"

# VPS last-resort example (priority 50, run with: notify-relay serve --relay):
# [[routes]]
# condition = "no_better_peer"
# channel = "phone"
